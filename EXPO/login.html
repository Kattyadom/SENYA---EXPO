<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SENYA</title>
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>
<body>
<div class="main-wrapper">
    <section class="login-container">
        <div class="login-image">
            <img src="https://deliveredcold.com/assets/LadyWorking-DOZ3s7BZ.png" alt="Background">
            <div class="overlay"></div>
            <div class="image-info">
    <div class="text-content">
        <div class="badge-pill">Join Us to Build </div>
        <h1>Start your Journey</h1>
        <p>Follow these simple steps to set up your account.</p>
    </div>
    <div class="steps-cards">
        <div class="step-card active">
            <span class="step-number">1</span>
            <p>Register your account</p>
        </div>
        <div class="step-card">
            <span class="step-number">2</span>
            <p>Set up your profile information</p>
        </div>
        <div class="step-card">
            <span class="step-number">3</span>
            <p>Enjoy calling any service you need</p>
        </div>
    </div>
</div>
        </div>
        <div class="login-card">
            <a href="index.html" class="back">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>
            <h2>Join us</h2>
            <p class="subtitle">Continue your SENYA experience.</p>
            <form>
    <div class="form-row">
        <div class="input-group">
            <label>First Name</label>
            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" placeholder="Your first name" required>
            </div>
        </div>

        <div class="input-group">
            <label>Last Name</label>
            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" placeholder="Your last name" required>
            </div>
        </div>
    </div>

    <div class="form-row">
        <div class="input-group">
            <label>Birthday</label>
            <div class="input-box">
                <i class="fa-solid fa-calendar"></i>
                <input type="date" required>
            </div>
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <div class="input-box">
                <i class="fa-solid fa-phone"></i>
                <input type="tel" placeholder="Your phone number" required>
            </div>
        </div>
    </div>

    <div class="input-group">
        <label>WhatsApp</label>
        <div class="input-box">
            <i class="fa-brands fa-whatsapp"></i>
            <input type="tel" placeholder="Your WhatsApp number" required>
        </div>
    </div>

    <div class="input-group">
        <label>Address</label>
        <div class="input-box">
            <i class="fa-solid fa-location-dot"></i>
            <input type="text" placeholder="Your address" required>
        </div>
    </div>

    <div class="input-group">
        <label>Email</label>
        <div class="input-box">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" placeholder="example@email.com" required>
        </div>
    </div>

    <div class="input-group">
        <label>Password</label>
        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Enter your password" required>
            <button type="button" id="togglePassword">
                <i class="fa-solid fa-eye"></i>
            </button>
        </div>
    </div>
    <div class="remember">
        <label>
            <input type="checkbox">
            Remember me
        </label>
    </div>
    <button class="login-btn" type="submit">
        Sign up
        <i class="fa-solid fa-arrow-right"></i>
    </button>
</form>
            <div class="divider">
                <span>Or</span>
            </div>
            <a href="signin.html" class="google-btn">
                <span>Sign in</span>
                <i class="fa-solid fa-arrow-right"></i>
                </a>
        </div>
    </section>
</div>
</section>
<script src="js/login.js"></script>
</body>
</html>
