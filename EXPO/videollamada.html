<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENYA - Video Call</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!--MEDIA PIPE VISION(OTRO SCRIPT PARA EL MOVIMIENTO DE CABEZA)-->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/videollamada.css">
</head>

<body>
   
   <!--Panel de accesibilidad-->
    <div class="accessibility-panel" id="accessibilityPanel">
        <div class="panel-header">
            <h3>Accessibility</h3>
            <button id="closePanel">×</button>
        </div>
        <div class="panel-content">
            <button class="acc-card low-vision" id="lowVisionBtn">
                <div class="acc-icon">👁️</div>
                <div class="acc-info">
                    <h4>Low Vision</h4>
                    <p>High contrast, larger text and stronger buttons</p>
                </div>
            </button>
            <button class="acc-card dyslexia-mode" id="dyslexiaBtn">
                <div class="acc-icon">📖</div>
                <div class="acc-info">
                    <h4>Dyslexia</h4>
                    <p>Friendly font, soft colors and more spacing</p>
                </div>
            </button>
            <button class="acc-card deaf-mode" id="deafBtn">
                <div class="acc-icon">🤟</div>
                <div class="acc-info">
                    <h4>Deaf Support</h4>
                    <p>Visual communication and larger icons</p>
                </div>
            </button>
            <button class="acc-card" id="activarHeadTracking">
                <div class="acc-icon">🔄</div>
                <div class="acc-info">
                    <h4>Head Control</h4>
                    <p>Navigate and scroll using head movements</p>
                </div>
            </button>
            <button class="acc-card speech-mode" id="speechBtn">
                <div class="acc-icon">🔊</div>
                <div class="acc-info">
                    <h4>Read Aloud</h4>
                    <p>Read the text on the screen with voice</p>
                </div>
            </button>

            <!-- TRADUCTOR SINCRONIZADO -->
            <button class="acc-card language-mode" id="langToggleBtn">
                <div class="acc-icon"><i class="fa-solid fa-language"></i></div>
                <div class="acc-info">
                    <h4>Switch Language</h4>
                    <p>Change between English and Spanish</p>
                </div>
            </button>
            
<!-- BARRA SLIDER VISIBLE Y ESTILIZADA -->
<div class="text-size-box" style="display: block !important; width: 100%; padding: 12px; background: rgba(0,0,0,0.03); border-radius: 10px; margin: 10px 0; box-sizing: border-box;">
    <div class="text-size-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <label for="textSizeSlider" style="font-weight: 600; font-size: 0.95rem; color: #1e293b;">Text Size</label>
        <span id="textSizeValue" style="font-weight: bold; color: #2563eb; font-size: 0.9rem;">100%</span>
    </div>
    <div class="slider-container" style="display: flex; align-items: center; gap: 10px; width: 100%;">
        <span style="font-size: 0.8rem; font-weight: bold; color: #64748b;">A-</span>
        <input type="range" id="textSizeSlider" min="80" max="150" value="100" step="5" style="-webkit-appearance: slider-horizontal !important; appearance: slider-horizontal !important; flex: 1; width: 100%; height: 6px; cursor: pointer; accent-color: #2563eb;">
        <span style="font-size: 1.2rem; font-weight: bold; color: #64748b;">A+</span>
    </div>
</div>

            <button class="reset-btn" id="resetAccessibility">
                Reset Accessibility
            </button>
        </div>
    </div>

    <!-- Contenedor oculto necesario para que funcione el Translate de Google -->
    <div id="google_translate_element" style="display: none;"></div>


    <header class="navbar">
        <div class="navbar-container">
            <a href="#" class="logo">
                <img src="img/Senyalogo.png" alt="SENYA Logo">
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="opciones.html">Partner Network</a></li>
                    <li><a href="profile.html">Profile</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="soporte.html">Contact</a></li>
                </ul>
            </nav>
            <a href="#" class="help-btn" id="accessibilityBtn">
                Accesibility
            </a>
            <div class="menu-toggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    <main class="call-page">
        <div class="call-header">
            <div class="call-status">
                <span class="status-dot"></span>
                <span>Call in progress</span>
            </div>
            <div class="call-time">
                <i class="fa-regular fa-clock"></i>
                <span id="callTimer">00:00</span>
            </div>
        </div>
        <section class="call-area" id="callArea">
    <div class="main-video">
        <!-- Etiqueta de video real para el usuario remoto -->
        <video id="remoteVideo" autoplay playsinline style="width:100%; height:100%; object-fit:cover;"></video>
        
        <div class="video-placeholder" id="remotePlaceholder">
            <div class="person-avatar">
                <i class="fa-solid fa-user"></i>
            </div>
            <h2>Interpreter</h2>
            <p>Waiting for video...</p>
        </div>
        
        <div class="video-info">
            <div>
                <strong>Interpreter</strong>
                <span>Sign Language Interpreter</span>
            </div>
            <div class="connection">
                <i class="fa-solid fa-wifi"></i>
                Excellent connection
            </div>
        </div>
    </div>

    <div class="self-video">
        <!-- Etiqueta de video real para ti (cámara propia) -->
        <video id="localVideo" autoplay muted playsinline style="width:100%; height:100%; object-fit:cover;"></video>
        <div class="self-label">
            <span>You</span>
        </div>
    </div>
    
    <button class="expand-video" id="expandButton" aria-label="Expand video">
        <i class="fa-solid fa-expand"></i>
    </button>
</section>

        <div class="controls">
            <button class="control-button" id="micButton" aria-label="Microphone">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <button class="control-button" id="cameraButton" aria-label="Camera">
                <i class="fa-solid fa-video"></i>
            </button>
            <button class="control-button" aria-label="Speaker">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <button class="end-call" id="endCallButton" aria-label="End call">
                <i class="fa-solid fa-phone-slash"></i>
            </button>
        </div>
    </main>

<!-- Código JavaScript para activar la pantalla completa -->
<script>
    const expandButton = document.getElementById('expandButton');
    const callArea = document.getElementById('callArea');

    expandButton?.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            callArea.requestFullscreen().catch(err => {
                alert(`Error al intentar poner en pantalla completa: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    });
</script>

<!-- Librería Socket.io provista automáticamente por el servidor -->
<script src="/socket.io/socket.io.js"></script>
<!-- Tu script de accesibilidad previo -->
<script src="js/accessibility.js"></script>
<!-- Tu nuevo script de videollamada real -->
<script src="js/videollamada-funcional.js"></script>
<!--SCRIPT PARA MOVIMIENTO CON LA CABEZA-->
<script type="module" src="js/head-tracking.js"></script>
<!-- Cursor virtual controlado por la cabeza -->
<div id="headCursor" style="position: fixed; width: 20px; height: 20px; background-color: #2563eb; border: 3px solid #ffffff; border-radius: 50%; pointer-events: none; z-index: 99999; display: none; transform: translate(-50%, -50%); box-shadow: 0 0 10px rgba(0,0,0,0.5);"></div>
   <!-- Script para Google Translate -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
